<div class="app">

    <button data-page="approvals"><span class="ico">✋</span>Ekibe Danışma<span class="count" id="approvalCount">3</span></button>
    <button data-page="insights"><span class="ico">✳</span>Analiz ve Bulgular</button>
    <button data-page="reports"><span class="ico">▥</span>Raporlar</button>
    <button data-page="liveMessages"><span class="ico">📥</span>Canlı Gelenler</button>

    <div class="profile"><div class="avatar">O</div><span>AYDA Yönetimi<small>Yönetici görünümü</small></span></div>
  </div>
</aside>
<main class="main">
  <header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="iconbtn mobile-menu" id="menuBtn" aria-label="Menüyü aç">☰</button><div class="crumb">Arya <span style="color:#566779">/</span> <b id="crumb">Genel Bakış</b></div></div><div class="top-actions"><span class="pill"><i class="dot"></i> Bağlantı bekleniyor</span><button class="iconbtn" id="helpBtn" title="Bilgi">?</button></div></header>

</div>

 {group:"A1 Kasım Grubu",person:"Öğrenci",time:"15:18",type:"Kişisel durum",text:"Ders kaydına erişim sorunu olduğunu söylüyor. Hesap bilgisi gerektirebileceği için önce ekibin kontrol etmesi iyi olur.",risk:"Hesap erişimi"},
 {group:"AYDA Yönetim",person:"Esra",time:"12:06",type:"Karar onayı",text:"Yeni kayıt indirimiyle ilgili soru geldi. Güncel kampanya koşulunu yönetimden doğrulamadan yanıt vermemeliyim.",risk:"Ticari karar"}
]};
const convos=[
 {group:"AYDA Yönetim",sub:"Yönetim • 8 katılımcı",text:"Yeni dönem için eğitmen ve sınıf planı konuşuluyor.",tag:"Karar bekliyor",tone:"yellow",time:"2 dk",icon:"🏢",topic:"Toplantı planı",people:"Esra, Sami, Aylin",summary:"Yeni dönem gruplarının açılış sırası ve tanıtım toplantısı tarihi konuşuluyor. İki farklı saat önerilmiş; net karar henüz yazılmamış.",messages:[["Esra","Yeni dönem duyurusunu cuma paylaşalım mı?","16:31"],["Sami","Önce eğitmen planını netleştirelim, sonra paylaşalım.","16:34"],["Aylin","Toplantı için 19.00 uygun görünüyor.","16:40"]]},

 {group:"AYDA Eğitim Ekibi",sub:"Eğitmenler • 11 katılımcı",text:"Cumartesi tanıtım oturumunun saati farklı mesajlarda değişiyor.",tag:"Saat çelişkisi",tone:"yellow",time:"34 dk",icon:"👩‍🏫",topic:"Tanıtım oturumu",people:"Melda, Hazal, Furkan",summary:"Cumartesi tanıtım oturumu için 14.00 ve 15.00 saatleri yazılmış. Ajan net saat önermeden önce ekip teyidi istiyor.",messages:[["Hazal","Cumartesi tanıtım 14.00 diye not almıştım.","14:42"],["Furkan","Bende 15.00 yazıyor, hangisi kesinleşti?","14:45"]]},
 {group:"B1 Sınav Hazırlık",sub:"B1 kursu • 16 katılımcı",text:"ÖSD deneme sınavı için katılımcı sayısı toparlanıyor.",tag:"Bilgi çıkarıldı",tone:"blue",time:"1 sa",icon:"📝",topic:"Deneme sınavı",people:"Dudu, 9 öğrenci",summary:"9 kişi deneme sınavına katılacağını yazdı. Henüz kesin kayıt listesi değil; sayı mesajlardan geçici olarak çıkarıldı.",messages:[["Dudu","Şu ana kadar 9 kişi katılacağını yazdı.","14:02"],["Öğrenci","Ben de geliyorum.","14:10"]]},

];
function escapeHtml(value){return String(value).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]))}
function header(eyebrow,title,desc,extra=""){return '<div class="pagehead"><div><div class="eyebrow">'+eyebrow+'</div><h1>'+title+'</h1><p>'+desc+'</p></div><div class="date">Örnek görünüm · bugün</div></div>'+extra}
function cardhead(title,sub="",button=""){return '<div class="cardhead"><div><h2>'+title+'</h2>'+(sub?'<p>'+sub+'</p>':'')+'</div>'+button+'</div>'}
function metrics(){return '<div class="grid metrics"><div class="card metric"><div class="metric-label">İzlenen grup</div><div class="metric-value accent-mint">8</div><div class="metric-foot">Örnek çalışma alanı</div></div><div class="card metric"><div class="metric-label">Bugün incelenen mesaj</div><div class="metric-value accent-blue">246</div><div class="metric-foot">Demo verisi</div></div><div class="card metric"><div class="metric-label">Ekip teyidi bekleyen</div><div class="metric-value accent-amber">'+state.approvals.length+'</div><div class="metric-foot">İnsan onayı örneği</div></div><div class="card metric"><div class="metric-label">Çıkarılan görev</div><div class="metric-value accent-purple">7</div><div class="metric-foot">Örnek görevler</div></div></div>'}
function convoRow(c){return '<div class="conversation" data-open="'+convos.indexOf(c)+'" tabindex="0" role="button" aria-label="'+escapeHtml(c.group+" — "+c.topic)+'"><div class="groupicon">'+c.icon+'</div><div><div class="convo-title">'+c.group+'</div><div class="convo-preview">'+c.text+'</div><span class="tag '+c.tone+'">'+c.tag+'</span></div><div class="time">'+c.time+'</div></div>'}
function insight(icon,title,text,tag,tone){return '<div class="insight"><div class="insighticon">'+icon+'</div><div><strong>'+title+'</strong><p>'+text+'</p><span class="tag '+tone+'">'+tag+'</span></div></div>'}
function approvalCard(a,i){return '<div class="queuebox"><div style="display:flex;justify-content:space-between;gap:10px"><strong>'+a.group+'</strong><span class="time">'+a.time+'</span></div><p><b style="color:#cfd9e2">'+a.type+' · '+a.person+'</b><br>'+a.text+'</p><span class="tag yellow">'+a.risk+'</span><div class="actions" style="margin-top:11px"><button class="btn primary" data-approve="'+i+'">İnceledim</button><button class="btn secondary" data-detail="'+i+'">Ayrıntı</button></div></div>'}
function overview(){return header("Kontrol merkezi","Merhaba, AYDA ekibi","Arya grup konuşmalarını anlamlandırır, önemli noktaları çıkarır ve gerektiğinde kararı size bırakır.")+'<div class="warning"><span>ⓘ</span><div><b>Örnek çalışma alanı</b> — Ekrandaki sayılar ve mesajlar demo verisidir. WhatsApp grupları veya OpenAI ajanı bu panele bağlı değil.</div></div>'+metrics()+'<div class="grid split"><section class="card">'+cardhead("Son grup hareketleri","Önemli konuşmalar ve son gelişmeler",'<button class="linkbtn" data-go="conversations">Tüm konuşmalar →</button>')+convos.slice(0,4).map(convoRow).join('')+'</section><section class="card">'+cardhead("Arya’nın dikkat ettikleri","Belirsizlik, karar ve takip noktaları")+
insight("⚠","Saat bilgisi net değil","Eğitim Ekibi grubunda 14.00 ve 15.00 geçiyor.","Teyit gerekli","yellow")+
insight("✦","Katılımcı sayısı çıkarıldı","B1 denemesi için mesajlarda 9 kişi olumlu yanıt verdi.","Geçici sayı","blue")+
insight("✓","Bir karar üzerinde uzlaşı","Reklam metninde tarih ve başvuru bağlantısı eklenecek.","Karar özeti","green")+
'<div style="margin-top:13px"><button class="btn secondary" data-go="insights">Tüm bulgulara bak</button></div></section></div>'+
'<div class="grid lower"><section class="card">'+cardhead("Son etkinlikler","Ajanın yaptığı örnek işlemler")+
'<div class="activity-row"><i class="activity-dot"></i><div>AYDA Yönetim konuşması özetlendi<small>2 dakika önce · Örnek</small></div></div><div class="activity-row"><i class="activity-dot" style="background:var(--amber)"></i><div>Çelişkili saat için ekip teyidi istendi<small>34 dakika önce · Örnek</small></div></div><div class="activity-row"><i class="activity-dot" style="background:var(--mint)"></i><div>Deneme sınavı katılımcı sayısı çıkarıldı<small>1 saat önce · Örnek</small></div></div></section><section class="card">'+cardhead("Bugünkü mesaj türleri","Örnek dağılım")+
'<div class="progressrow"><span>Bilgi paylaşımı</span><div class="bar"><i style="width:72%"></i></div><b>72</b></div><div class="progressrow"><span>Soru / yardım</span><div class="bar"><i style="width:48%;background:linear-gradient(90deg,#789eef,#a7c2ff)"></i></div><b>48</b></div><div class="progressrow"><span>Karar / görev</span><div class="bar"><i style="width:34%;background:linear-gradient(90deg,#c09af9,#d7c2ff)"></i></div><b>34</b></div><div class="progressrow"><span>Teyit gereken</span><div class="bar"><i style="width:19%;background:linear-gradient(90deg,#d39b53,#f0cb80)"></i></div><b>19</b></div></section></div>'}
function conversations(){let filtered=convos.filter(c=>(state.filter==="Tümü"||c.tag===state.filter)&&(!state.search||(c.group+" "+c.text+" "+c.tag).toLowerCase().includes(state.search.toLowerCase())));return header("Mesaj akışı","Konuşmalar","Grup konuşmalarını konu, karar, katılımcı ve takip noktalarıyla inceleyin.")+'<div class="warning"><span>ⓘ</span><div><b>Demo mesajları</b> — Bu konuşmalar örnektir; gerçek WhatsApp mesajı yüklenmemiştir.</div></div><section class="card">'+cardhead("Grup listesi","Son hareketlere göre sıralandı",'<input class="content-search" id="search" placeholder="Grup veya konu ara…" value="'+escapeHtml(state.search)+'">')+'<div class="tabs">'+["Tümü","Karar bekliyor","İnsana danış","Saat çelişkisi","Bilgi çıkarıldı","Özet hazır"].map(x=>'<button class="tab '+(state.filter===x?'active':'')+'" data-filter="'+x+'">'+x+'</button>').join('')+'</div>'+filtered.map(convoRow).join('')+'</section>'}
function detail(c){return header("Konuşma ayrıntısı",c.group,c.sub+' · Örnek kayıt')+'<div class="warning"><span>ⓘ</span><div>Bu konuşma örnek veridir. Buradan gönderilen metin WhatsApp’a iletilmez.</div></div><div class="conversation-detail"><section class="card">'+cardhead("Mesaj akışı",c.topic)+'<div>'+c.messages.map(m=>'<div class="message"><b>'+m[0]+'</b><br>'+m[1]+'<small>'+m[2]+' · Örnek mesaj</small></div>').join('')+'</div><div class="fieldrow"><input id="draft" placeholder="Demo yanıt taslağı yaz…"><button id="draftBtn">Taslak ekle</button></div></section><aside class="card">'+cardhead("Arya’nın özeti")+'<div class="insight"><div class="insighticon">✦</div><div><strong>'+c.topic+'</strong><p>'+c.summary+'</p></div></div><div class="setting"><div>Konuşmadaki kişiler<small>'+c.people+'</small></div></div><div class="setting"><div>Durum<small>'+c.tag+'</small></div></div><div class="setting"><div>İşlem modu<small>Öneri ve taslak · gönderim kapalı</small></div></div></aside></div>'}
function approvals(){return header("İnsan denetimi","Ekibe danışma kuyruğu","Belirsiz, hassas veya karar gerektiren konular önce ekibin önüne gelir.")+'<div class="warning"><span>ⓘ</span><div><b>Onay akışı demosu</b> — “İnceledim” işlemi yalnızca bu sayfadaki örneği kuyruktan kaldırır.</div></div><div class="grid split"><section class="card">'+cardhead("Teyit bekleyen konular",state.approvals.length+" örnek kayıt")+(state.approvals.length?state.approvals.map(approvalCard).join(""):'<div class="empty">Kuyruk boş. Örnek kayıtların hepsi incelendi.</div>')+'</section><aside class="card">'+cardhead("Arya ne zaman danışır?")+
'<div class="step"><div class="stepnum">1</div><div><strong>Bilgi çelişiyorsa</strong><p>Saat, tarih veya koşullar farklı mesajlarda değişiyorsa.</p></div></div><div class="step"><div class="stepnum">2</div><div><strong>Karar yetkisi gerekiyorsa</strong><p>Ücret, indirim, kayıt veya kurum kararı gibi konularda.</p></div></div><div class="step"><div class="stepnum">3</div><div><strong>Kişisel bilgi söz konusuysa</strong><p>Hesap, öğrenci kaydı veya özel durum içeren taleplerde.</p></div></div><div class="step"><div class="stepnum">4</div><div><strong>Yanıtından emin değilse</strong><p>Önce taslak sunar; kendi başına mesaj göndermez.</p></div></div></aside></div>'}
function insights(){return header("Konuşma zekâsı","Analiz ve bulgular","Grup mesajlarından çıkan kararları, sorumluları, tutarları ve belirsizlikleri görün.")+'<div class="warning"><span>ⓘ</span><div><b>Örnek analizler</b> — Bu bulgular gerçek grup geçmişinden üretilmedi.</div></div><div class="grid metrics"><div class="card metric"><div class="metric-label">Karar adayı</div><div class="metric-value accent-purple">6</div><div class="metric-foot">Ekip onayı bekleyebilir</div></div><div class="card metric"><div class="metric-label">Takip görevi</div><div class="metric-value accent-blue">7</div><div class="metric-foot">Sorumlu veya tarih aranıyor</div></div><div class="card metric"><div class="metric-label">Belirsiz bilgi</div><div class="metric-value accent-amber">3</div><div class="metric-foot">Saat ve tarih çakışmaları</div></div><div class="card metric"><div class="metric-label">Bahsi geçen tutar</div><div class="metric-value accent-mint">2</div><div class="metric-foot">Doğrulanmamış örnek kayıt</div></div></div><div class="grid split"><section class="card">'+cardhead("Karar ve takip listesi","Örnek çıkarımlar")+'<table class="table"><thead><tr><th>Konu</th><th>Çıkarım</th><th>Durum</th></tr></thead><tbody><tr><td>Reklam metni</td><td>Başlangıç tarihi ve başvuru bağlantısı eklenecek</td><td><span class="tag green">Uzlaşı</span></td></tr><tr><td>Tanıtım oturumu</td><td>14.00 / 15.00 seçenekleri geçiyor</td><td><span class="tag yellow">Teyit</span></td></tr><tr><td>B1 deneme sınavı</td><td>9 kişi olumlu yanıt verdi</td><td><span class="tag blue">Geçici</span></td></tr><tr><td>Ders kaydı</td><td>Erişim sorunu ekipçe kontrol edilecek</td><td><span class="tag red">Takip</span></td></tr></tbody></table></section><section class="card">'+cardhead("Katılımcı ve bağlam","Kim, hangi konuda konuşuyor?")+insight("👥","Eğitim Ekibi","Ders ve etkinlik planlamasıyla ilgili 11 katılımcı.","Örnek grup","blue")+insight("📚","A1 Kasım Grubu","Ders kayıtlarına erişim sorusu öne çıkıyor.","Örnek grup","purple")+insight("🏢","AYDA Yönetim","Yeni dönem planlama ve tanıtım kararları.","Örnek grup","green")+'</section></div>'}
function reports(){return header("Özet ve eğilimler","Raporlar","Mesaj hareketini anlaşılır günlük ve haftalık özetlere dönüştürün.")+'<div class="warning"><span>ⓘ</span><div><b>Demo raporu</b> — Tüm metrikler örnektir; gerçek grup verisine dayanmaz.</div></div><div class="grid metrics"><div class="card"><div class="metric-label">İncelenen mesaj</div><div class="report-number">1.284</div><div class="report-caption">örnek haftalık toplam</div></div><div class="card"><div class="metric-label">Çıkarılan karar</div><div class="report-number accent-purple">21</div><div class="report-caption">örnek karar adayı</div></div><div class="card"><div class="metric-label">Takip konusu</div><div class="report-number accent-blue">34</div><div class="report-caption">örnek görev ve soru</div></div><div class="card"><div class="metric-label">Ekibe yönlendirilen</div><div class="report-number accent-amber">8</div><div class="report-caption">örnek teyit talebi</div></div></div><div class="grid split"><section class="card">'+cardhead("Haftalık hareket","Örnek mesaj dağılımı")+'<div class="progressrow"><span>Bilgi paylaşımı</span><div class="bar"><i style="width:52%"></i></div><b>52%</b></div><div class="progressrow"><span>Soru / destek</span><div class="bar"><i style="width:28%;background:#83a9ff"></i></div><b>28%</b></div><div class="progressrow"><span>Karar / görev</span><div class="bar"><i style="width:15%;background:#c5a6ff"></i></div><b>15%</b></div><div class="progressrow"><span>Belirsizlik</span><div class="bar"><i style="width:5%;background:#efc779"></i></div><b>5%</b></div></section><section class="card">'+cardhead("Rapor kapsamı","Neler özetlenebilir?")+
'<div class="activity-row"><i class="activity-dot"></i><div>Grup bazında mesaj yoğunluğu<small>Günlük ve haftalık görünüm</small></div></div><div class="activity-row"><i class="activity-dot" style="background:var(--purple)"></i><div>Kararlar ve açık kalan işler<small>Sorumlu ve son tarih bilgisiyle</small></div></div><div class="activity-row"><i class="activity-dot" style="background:var(--amber)"></i><div>Tekrarlayan soru ve sorunlar<small>Hangi grupta, ne sıklıkta</small></div></div><div class="activity-row"><i class="activity-dot" style="background:var(--mint)"></i><div>Ekip teyidi ve yanıt taslakları<small>İnsan denetimi görünümü</small></div></div></section></div>'}
function setup(){return header("Yapılandırma","Ajan ve bağlantılar","Arya’nın izinleri, veri kaynakları ve güvenli canlıya geçiş adımları.")+'<div class="warning"><span>ⓘ</span><div><b>Bağlantılar kapalı</b> — Genel bakış ve rapor kartları örnek veridir. Canlı alanlar yönetici oturumu ve Neon bağlantısı bekler; webhook ve gönderim ayarları eklenene kadar kapalıdır.</div></div><div class="grid split"><section class="card">'+cardhead("Bağlantı durumu","API bilgilerini daha sonra sen ekleyeceksin")+'<div class="setting"><div>Meta WhatsApp Cloud API<small>Numara, webhook ve erişim bilgisi gerekli</small></div><span class="tag yellow">Beklemede</span></div><div class="setting"><div>OpenAI ajan servisi<small>Gizli anahtar yalnızca sunucu ortamına eklenmeli</small></div><span class="tag yellow">Beklemede</span></div><div class="setting"><div>Kalıcı kayıt ve yönetici oturumu<small>Neon ve yönetici ortam değerleri bağlanınca tablolar otomatik kurulur.</small></div><span class="tag blue">Kurulum bekliyor</span></div><div class="setting"><div>Otomatik gönderim<small>Başlangıçta kapalı; öneri ve insan onayı modu</small></div><span class="tag red">Kapalı</span></div></section><section class="card">'+cardhead("Canlıya geçiş sırası","API anahtarlarını eklemeden önce")+'<div class="step"><div class="stepnum">1</div><div><strong>Sunucu tarafı API katmanı</strong><p>OpenAI ve Meta bilgileri tarayıcı koduna yazılmaz; güvenli sunucu değişkenlerinde saklanır.</p></div></div><div class="step"><div class="stepnum">2</div><div><strong>Webhook alımı ve doğrulama</strong><p>Meta webhook imzasını doğrula, yinelenen mesajları ayıkla ve güvenli şekilde kuyruğa al.</p></div></div><div class="step"><div class="stepnum">3</div><div><strong>Ajan ve insan onayı</strong><p>Önce yalnızca özet ve yanıt taslağı üret; ekibin onayı olmadan gönderim yapma.</p></div></div><div class="step"><div class="stepnum">4</div><div><strong>Deneme grubu ve yayın</strong><p>Gerçek mesaj akışını izinli testte doğrula; grup erişimi ve saklama kapsamını ayrıca teyit et.</p></div></div></section></div><section class="card" style="margin-top:15px">'+cardhead("Güvenli kullanım notu","Bu demo için sır veya API anahtarı ekleme")+'<p style="font-size:13px;color:#a7b4c1;margin:0">API anahtarı HTML, JavaScript, GitHub’a açık dosyalar veya ziyaretçinin tarayıcısında görünmemeli. Yönetici oturumu, kalıcı kayıt, imzalı webhook alımı ve insan onay kuyruğu kodda hazır. Neon ve gerekli API değerleri Vercel’e bağlanana kadar canlı işlem kapalıdır. Token veya anahtarını sohbete ya da GitHub dosyalarına yapıştırma.</p></section>'}
function render(){let titles={overview:"Genel Bakış",conversations:"Konuşmalar",approvals:"Ekibe Danışma",insights:"Analiz ve Bulgular",reports:"Raporlar",setup:"Ajan ve Bağlantılar"};document.getElementById("crumb").textContent=titles[state.page]||"Konuşma";document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===state.page));let html=state.page==="overview"?overview():state.page==="conversations"?conversations():state.page==="approvals"?approvals():state.page==="insights"?insights():state.page==="reports"?reports():state.page==="setup"?setup():detail(convos[state.selectedIndex]||convos[0]);document.getElementById("page").innerHTML=html;bind()}
function toast(msg){let old=document.querySelector(".toast");if(old)old.remove();let n=document.createElement("div");n.className="toast";n.textContent=msg;document.body.append(n);setTimeout(()=>n.remove(),2600)}
function bind(){document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll("[data-open]").forEach(el=>{const open=()=>{state.selectedIndex=Number(el.dataset.open);state.page="detail";render()};el.onclick=open;el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}}});document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});let search=document.getElementById("search");if(search)search.oninput=e=>{let pos=e.target.selectionStart;state.search=e.target.value;render();let next=document.getElementById("search");next.focus();next.setSelectionRange(pos,pos)};document.querySelectorAll("[data-approve]").forEach(b=>b.onclick=()=>{state.approvals.splice(Number(b.dataset.approve),1);document.getElementById("approvalCount").textContent=state.approvals.length;render();toast("Örnek kayıt kuyruktan kaldırıldı.")});document.querySelectorAll("[data-detail]").forEach(b=>b.onclick=()=>toast("Bu örnek kayıtta ekibin kontrol etmesi gereken bilgi gösteriliyor."));let draftBtn=document.getElementById("draftBtn");if(draftBtn)draftBtn.onclick=()=>{let input=document.getElementById("draft");if(input.value.trim()){let box=document.createElement("div");box.className="message mine";box.innerHTML="<b>Demo taslağı</b><br><span></span><small>Gönderilmedi · yalnızca bu ekranda</small>";box.querySelector("span").textContent=input.value;document.querySelector(".fieldrow").before(box);input.value=""}}}
function go(p){state.page=p;state.search="";document.getElementById("sidebar").classList.remove("open");render();window.scrollTo(0,0)}
document.getElementById("nav").onclick=e=>{let b=e.target.closest("button[data-page]");if(b)go(b.dataset.page)};document.getElementById("menuBtn").onclick=()=>document.getElementById("sidebar").classList.toggle("open");document.getElementById("helpBtn").onclick=()=>toast("Arya şu anda demo verisiyle çalışıyor; API bağlantıları beklemede.");render();
</script>
<script src="/admin.js"></script>
