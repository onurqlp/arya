<title>Arya — WhatsApp Operasyon Ajanı</title>
<style>

*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 520px at 95% -5%,#1c3440 0%,transparent 63%),var(--bg);color:var(--text);font-size:15px;line-height:1.5}button,input{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}.sidebar{border-right:1px solid var(--line);padding:23px 16px;background:#101720e8;display:flex;flex-direction:column;gap:28px}.brand{display:flex;align-items:center;gap:12px;padding:0 8px}.brandmark{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#76edc8,#38a98f);color:#08241e;font-weight:900;font-size:20px;box-shadow:0 8px 24px #51d8b335}.brand strong{display:block;font-size:17px;letter-spacing:.2px}.brand small{color:var(--muted);font-size:12px}.navlabel{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:#758699;padding:0 12px 8px;font-weight:700}.nav{display:grid;gap:5px}.nav button{width:100%;border:0;background:transparent;color:#aab7c5;text-align:left;padding:11px 12px;border-radius:11px;display:flex;gap:12px;align-items:center;font-weight:600;font-size:14px}.nav button:hover,.nav button.active{background:#202c38;color:#f5fbff}.nav button.active{box-shadow:inset 3px 0 var(--mint)}.ico{width:20px;text-align:center;font-size:16px}.count{margin-left:auto;background:#243b3b;color:#8de7ce;border-radius:99px;padding:1px 8px;font-size:11px}.sidebar-bottom{margin-top:auto}.demo-note{border:1px solid #364658;background:linear-gradient(135deg,#17242c,#1a2631);border-radius:14px;padding:14px;color:#b5c3d0;font-size:12px}.demo-note strong{color:var(--amber);display:block;margin-bottom:5px;font-size:12px}.profile{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:17px 8px 0;margin-top:14px}.avatar{width:34px;height:34px;border-radius:50%;background:#31465b;display:grid;place-items:center;color:#bfe5ff;font-weight:800}.profile span{font-size:13px}.profile small{display:block;color:var(--muted);font-size:11px}.main{min-width:0;padding:26px clamp(18px,3vw,42px) 48px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:25px}.crumb{font-size:13px;color:var(--muted)}.crumb b{color:#dce7f0;font-size:14px}.top-actions{display:flex;align-items:center;gap:10px}.pill{border:1px solid var(--line);background:#161f2a;color:#c4cfda;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:7px}.dot{width:8px;height:8px;background:var(--amber);border-radius:50%;box-shadow:0 0 0 3px #f1c77b22}.iconbtn{width:38px;height:38px;border:1px solid var(--line);background:#161f2a;color:#c5d1dc;border-radius:12px;font-size:16px}.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:8px 0 22px}.eyebrow{color:var(--mint);font-weight:800;letter-spacing:1.1px;text-transform:uppercase;font-size:11px;margin-bottom:6px}.pagehead h1{font-size:clamp(26px,3vw,35px);line-height:1.15;margin:0;letter-spacing:-.8px}.pagehead p{color:var(--muted);margin:8px 0 0;font-size:14px}.date{color:#9fb0c0;font-size:12px}.warning{border:1px solid #54472e;background:#27251f;border-radius:13px;padding:12px 15px;color:#d4c39c;font-size:13px;margin:0 0 19px;display:flex;gap:11px;align-items:flex-start}.warning b{color:#f4d28e}.grid{display:grid;gap:15px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.card{background:linear-gradient(155deg,#18212c,#141b24);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0;box-shadow:0 10px 26px #00000012}.metric{position:relative;overflow:hidden}.metric:after{content:"";position:absolute;width:78px;height:78px;border:1px solid #ffffff09;border-radius:50%;right:-27px;top:-31px}.metric-label{color:#9eacbb;font-size:12px;font-weight:600}.metric-value{font-size:31px;font-weight:800;letter-spacing:-1px;margin:10px 0 2px}.metric-foot{font-size:12px;color:#8798a9}.accent-mint{color:var(--mint)}.accent-blue{color:var(--blue)}.accent-amber{color:var(--amber)}.accent-purple{color:var(--purple)}.split{grid-template-columns:minmax(0,1.45fr) minmax(290px,.85fr);align-items:start}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.cardhead h2{font-size:16px;margin:0;letter-spacing:-.2px}.cardhead p{font-size:12px;color:var(--muted);margin:3px 0 0}.linkbtn{border:0;background:transparent;color:var(--mint);font-size:12px;font-weight:700;padding:4px}.conversation{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:11px;padding:13px 0;border-top:1px solid #25303c;align-items:start}.groupicon{width:36px;height:36px;border-radius:12px;background:#24363d;display:grid;place-items:center;font-size:17px}.convo-title{font-size:13px;font-weight:750}.convo-preview{color:#9aaaba;font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.time{color:#7f90a1;font-size:11px;white-space:nowrap}.tag{font-size:10px;font-weight:750;padding:4px 8px;border-radius:99px;display:inline-block;margin-top:6px}.tag.green{background:#1d3c36;color:#8be4c7}.tag.yellow{background:#413723;color:#f0cc82}.tag.blue{background:#25374c;color:#9bc6ff}.tag.red{background:#43282e;color:#ff9da3}.tag.purple{background:#382e4b;color:#d2baff}.insight{display:flex;gap:11px;padding:12px 0;border-top:1px solid #25303c}.insight:first-of-type{border-top:0;padding-top:0}.insighticon{width:31px;height:31px;flex:none;border-radius:10px;background:#27333e;display:grid;place-items:center}.insight strong{font-size:12px;display:block}.insight p{font-size:12px;color:#9aaaba;margin:3px 0 0}.insight .tag{margin-top:7px}.lower{grid-template-columns:1fr 1fr;margin-top:16px}.activity-row{display:flex;gap:10px;padding:10px 0;border-top:1px solid #25303c;font-size:12px;color:#a9b6c3}.activity-row:first-of-type{border-top:0}.activity-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;background:var(--blue); ;color:#08251e;padding:0 14px;font-weight:800}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{text-align:left;color:#8193a4;font-weight:700;padding:10px 8px;border-bottom:1px solid var(--line)}.table td{padding:12px 8px;border-bottom:1px solid #25303c;color:#c1ccd6;vertical-align:top}.report-number{font-size:27px;font-weight:800;margin:8px 0 0}.report-caption{font-size:12px;color:var(--muted)}.step{display:flex;gap:12px;padding:13px 0;border-top:1px solid #25303c}.step:first-of-type{border-top:0}.stepnum{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#26383b;color:#9debd5;font-weight:800;font-size:12px;flex:none}.step strong{font-size:13px}.step p{font-size:12px;color:#9baab8;margin:3px 0 0}.setting{display:flex;justify-content:space-between;gap:15px;padding:14px 0;border-top:1px solid #25303c;font-size:13px}.setting small{display:block;color:#8f9eac;margin-top:3px}.toggle{width:38px;height:22px;border-radius:99px;background:#3b4c59;position:relative;flex:none}.toggle:after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;background:#c8d4df;border-radius:50%}.empty{padding:24px;text-align:center;color:#99a9b8;font-size:13px}.toast{position:fixed;right:22px;bottom:22px;background:#213c36;border:1px solid #437064;color:#d4fff2;padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px #0008;z-index:10;animation:in .2s ease}@keyframes in{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}.mobile-menu{display:none}
.navlabel,.brand small,.profile small,.time,.tag{font-size:12px}.cardhead p,.metric-label,.metric-foot,.convo-preview,.insight strong,.insight p,.activity-row,.progressrow,.queuebox p,.report-caption,.step p,.setting small,.table,.linkbtn,.tab,.btn{font-size:13px}.convo-title,.queuebox strong,.step strong,.setting{font-size:14px}.demo-note,.warning,.pagehead p{font-size:14px}
@media(max-width:1100px){.metrics{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.conversation-detail{grid-template-columns:1fr 270px}}
@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:5;inset:0 auto 0 0;width:260px;transform:translateX(-105%);transition:transform .22s;box-shadow:20px 0 50px #0007}.sidebar.open{transform:translateX(0)}.mobile-menu{display:inline-grid;place-items:center}.main{padding:17px 15px 35px}.topbar{margin-bottom:20px}.date{display:none}.pagehead{align-items:flex-start;flex-direction:column}.metrics{gap:10px}.metric{padding:14px}.metric-value{font-size:26px}.lower{grid-template-columns:1fr}.conversation-detail{grid-template-columns:1fr}.top-actions .pill{display:none}.card{padding:15px}.convo-preview{max-width:65vw}}

button.conversation{width:100%;text-align:left;border:0;background:transparent;color:var(--text);cursor:pointer}button.conversation:hover{background:#1e2b38}button.conversation .convo-preview{display:block}.empty{padding:22px 4px;color:var(--muted)}

<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brandmark">A</div><div><strong>Arya</strong><small>WhatsApp operasyon ajanı</small></div></div>
  <div><div class="navlabel">Çalışma alanı</div><nav class="nav" id="nav">
    <button class="active" data-page="overview"><span class="ico">◫</span>Genel Bakış</button>
    <button data-page="conversations"><span class="ico">▤</span>Konuşmalar</button>
    <button data-page="approvals"><span class="ico">✋</span>Ekibe Danışma</button>
    <button data-page="insights"><span class="ico">✳</span>Analiz ve Bulgular</button>
    <button data-page="reports"><span class="ico">▥</span>Raporlar</button>
  </nav></div>
  <div><div class="navlabel">Yönetim</div><nav class="nav">
    <button data-page="setup"><span class="ico">⚙</span>Ajan ve Bağlantılar</button>
  </nav></div>
  <div class="sidebar-bottom">
    <div class="demo-note" id="connectionNote">Bağlantı durumu yükleniyor…</div>
    <div class="profile"><div class="avatar">O</div><span>AYDA Yönetimi<small>Yönetici görünümü</small></span></div>
  </div>
</aside>
<main class="main">
  <header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="iconbtn mobile-menu" id="menuBtn" aria-label="Menüyü aç">☰</button><div class="crumb">Arya <span style="color:#566779">/</span> <b id="crumb">Genel Bakış</b></div></div><div class="top-actions"><span class="pill" id="connectionPill"><i class="dot"></i> Durum yükleniyor</span><button class="btn secondary" id="logoutBtn" hidden>Çıkış</button><button class="iconbtn" id="helpBtn" title="Bilgi">?</button></div></header>
  <div id="page"></div>
</main>
</div>
<script src="/admin.js" defer></script>
</body>
